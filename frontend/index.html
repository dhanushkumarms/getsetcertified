<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GetSet Certified</title>
  <link href="https://fonts.googleapis.com/css2?family=Merriweather&family=Poppins&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background-image: url('https://i.imgur.com/e9ETrMo.jpg'); /* Replace with your cert bg */
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      min-height: 100vh;
    }

    .overlay {
      background-color: rgba(255, 255, 255, 0.85);
      width: 100%;
      height: 100%;
      position: absolute;
      z-index: 0;
    }

    .container {
      position: relative;
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      align-items: center;
      height: 100vh;
      padding: 50px;
      z-index: 1;
    }

    .left {
      flex: 1.2;
      padding: 30px;
    }

    .left h1 {
      font-family: 'Merriweather', serif;
      font-size: 3rem;
      color: #333;
      margin-bottom: 10px;
    }

    .left p {
      font-size: 1.2rem;
      color: #444;
      margin-bottom: 20px;
    }

    .left button {
      padding: 12px 24px;
      font-size: 1rem;
      background-color: #D4AF37;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.3s ease;
    }

    .left button:hover {
      background-color: #b08a2e;
    }

    .right {
      flex: 0.8;
      background-color: white;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
    }

    .right h2 {
      font-size: 1.5rem;
      margin-bottom: 20px;
      text-align: center;
    }

    .form-group {
      margin-bottom: 15px;
    }

    input {
      width: 100%;
      padding: 12px;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    .right button {
      width: 100%;
      padding: 12px;
      background-color: #4CAF50;
      color: white;
      border: none;
      font-size: 1rem;
      border-radius: 6px;
      cursor: pointer;
    }

    .right button:hover {
      background-color: #45a049;
    }

    .right p {
      margin-top: 10px;
      text-align: center;
      font-size: 0.9rem;
    }

    .right a {
      color: #2B6CB0;
      text-decoration: none;
    }

    @media (max-width: 768px) {
      .container {
        flex-direction: column;
        padding: 20px;
      }

      .right, .left {
        width: 100%;
        margin-bottom: 20px;
      }
    }
  </style>
</head>
<body>
  <div class="overlay"></div>

  <div class="container">
    <div class="left">
      <h1>GetSet Certified</h1>
      <p>Your Gateway to Career Certifications</p>
      <p>Practice. Pass. Get Certified.</p>
      <button onclick="scrollToForm()">Get Started</button>
    </div>

    <div class="right" id="form-section">
      <h2>Login / Signup</h2>
      <form onsubmit="handleSubmit(event)">
        <div class="form-group">
          <input type="email" placeholder="Email" required />
        </div>
        <div class="form-group">
          <input type="password" placeholder="Password" required />
        </div>
        <button type="submit">Login</button>
        <p>Don't have an account? <a href="#">Sign up</a></p>
      </form>
    </div>
  </div>

  <script>
    function scrollToForm() {
      document.getElementById("form-section").scrollIntoView({ behavior: "smooth" });
    }

    function handleSubmit(e) {
      e.preventDefault();
      alert("Login feature is not connected yet.");
    }
  </script>
</body>
</html>
