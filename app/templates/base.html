<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}GetSetCertified{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="icon" href="{{ url_for('static', filename='img/logo.svg') }}">
</head>
<body class="min-h-screen bg-slate-950 text-slate-100">
  <header class="border-b border-slate-800">
    <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
      <a href="{{ url_for('main.home') }}" class="flex items-center gap-2">
        <img src="{{ url_for('static', filename='img/logo.svg') }}" class="h-8" alt="logo">
        <span class="font-semibold">GetSetCertified</span>
      </a>
      <nav class="flex gap-4 text-sm">
        <a href="{{ url_for('main.generate') }}" class="hover:text-white">Generate</a>
        <a href="https://github.com/your-username/getsetcertified" target="_blank" class="hover:text-white">GitHub</a>
      </nav>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-10">
    {% block content %}{% endblock %}
  </main>

  <footer class="border-t border-slate-800">
    <div class="max-w-6xl mx-auto px-4 py-6 text-sm text-slate-400">
      © {{ 2025 }} GetSetCertified. All rights reserved.
    </div>
  </footer>
</body>
</html>
