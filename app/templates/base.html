<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}GetSetCertified{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body class="bg-slate-950 text-slate-100 flex flex-col min-h-screen">

  <!-- Navbar -->
  <header class="flex items-center justify-between px-8 py-4 border-b border-slate-800">
    <div class="flex items-center gap-2">
      <img src="{{ url_for('static', filename='img/gsc_logo.png') }}" alt="Logo" class="h-8">
      <span class="font-semibold text-lg">GetSetCertified</span>
    </div>
    <nav class="flex gap-6">
      <a href="{{ url_for('main.generate') }}" class="hover:text-green-400">Generate</a>
      <a href="https://github.com/dhanushkumarms/getsetcertified" target="_blank" class="hover:text-green-400">GitHub</a>
    </nav>
  </header>

  <!-- Main content -->
  <main class="flex-1 px-8 py-10">
    {% block content %}{% endblock %}
  </main>

  <!-- Footer -->
  <footer class="py-3 text-center text-slate-500 text-sm fixed bottom-0 w-full bg-slate-950 border-t border-slate-800">
    © 2025 GetSetCertified
  </footer>

</body>
</html>
