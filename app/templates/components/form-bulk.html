<div class="p-6 rounded-2xl border border-slate-800 bg-slate-900">
  <h3 class="font-semibold text-lg mb-4">Bulk via CSV</h3>
  <p class="text-sm text-slate-400 mb-3">
    Upload a CSV file with columns:<br>
    <code>name, description, title, subtitle, signer</code>
  </p>
  <form method="post" enctype="multipart/form-data" class="space-y-4">
    <input type="file" name="file" accept=".csv" required class="input">
    <button type="submit" class="btn-primary w-full">Generate Certificates</button>
  </form>
</div>

<style>
  .input{ @apply w-full px-3 py-2 rounded-lg bg-slate-800 text-slate-100 border border-slate-700; }
  .btn-primary{ @apply px-4 py-2 rounded-lg bg-green-500/90 text-black font-semibold hover:bg-green-400; }
</style>
